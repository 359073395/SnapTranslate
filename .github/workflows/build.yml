name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SnapTranslate.slnx

      - name: Build
        run: dotnet build SnapTranslate.slnx -c Release --no-restore

      - name: Publish self-contained app
        run: >
          dotnet publish src/SnapTranslate/SnapTranslate.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -o artifacts/publish-v0.3.0

      - name: Package portable app
        shell: pwsh
        run: |
          Copy-Item README.md,CHANGELOG.md,LICENSE,THIRD_PARTY_NOTICES.md -Destination artifacts/publish-v0.3.0
          Compress-Archive -Path artifacts/publish-v0.3.0/* -DestinationPath artifacts/LingxiCapture-v0.3.0-win-x64.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\LingxiCapture.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: LingxiCapture-windows-x64
          path: |
            artifacts/LingxiCapture-v0.3.0-win-x64.zip
            artifacts/installer-v0.3.0/LingxiCapture-Setup-v0.3.0-win-x64.exe
          if-no-files-found: error
